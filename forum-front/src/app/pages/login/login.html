<section class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">🎓</div>
    <h1>Connexion</h1>
    <p class="muted center">Forum de l'ISET Radès</p>

    <form (ngSubmit)="submit()">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required placeholder="prenom@exemple.tn"
             [ngModel]="email()" (ngModelChange)="email.set($event)" />

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" required
             [ngModel]="password()" (ngModelChange)="password.set($event)" />

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button class="btn btn-primary full" type="submit" [disabled]="loading()">
        {{ loading() ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>

    <p class="muted center">
      Pas encore de compte ? <a routerLink="/register">S'inscrire</a>
    </p>
  </div>
</section>
