spring.application.name=forum-iset
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/forum_iset?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Africa/Tunis
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.rest.base-path=/data


app.registry.dir=${REGISTRY_DIR:./private-registry}

app.admin.email=${ADMIN_EMAIL:admin@iset.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ---------- JWT ----------
app.jwt.issuer=forum-iset
app.jwt.minutes=15
app.jwt.secret-base64=${JWT_SECRET_BASE64:YhKgIExInRDRDCOKVpO/LoVSF3fYv6rYE+3Agam1y59qaatlYFIidMS1Nbxu3SnH}
